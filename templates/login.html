<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {{ store }}</title>
  <link rel="icon" href="{{ url_for('static', filename='icono.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { align-items: center; justify-content: center; background: var(--side); min-height: 100vh; padding: 16px; }
    .login { width: 100%; max-width: 380px; }
    .login h1 { margin: 8px 0 4px; }
    .login form { display: grid; gap: 12px; margin-top: 18px; }
    .login .logo { display: block; width: 220px; max-width: 70%; margin: 0 auto 6px; }
    .login { text-align: center; } .login form { text-align: left; }
    body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--brand-red) 50%, var(--accent) 50%); }
    .hint { background: var(--warn-soft); color: var(--warn); padding: 10px 12px; border-radius: 8px; font-size: 13px; }
    #err { color: var(--bad); min-height: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card login">
    <img class="logo" src="/logo.png" alt="{{ store }}">
    <h1 class="hidden">{{ store or "Punto de venta" }}</h1>
    <div class="muted">Inicia sesión para continuar</div>
    <form id="f" autocomplete="on">
      {% if first_run %}<div class="hint">Primer inicio: usuario <b>admin</b>, contraseña <b>admin</b>. Te pediremos cambiarla.</div>{% endif %}
      <label class="f">Usuario<input name="username" autocomplete="username" autofocus required></label>
      <label class="f">Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <div id="err"></div>
      <button class="primary big-btn" type="submit">Entrar</button>
    </form>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      if (r.ok) location.href = "/";
      else document.getElementById("err").textContent = (await r.json()).error || "Error";
    });
  </script>
</body>
</html>
