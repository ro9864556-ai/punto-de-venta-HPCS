<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punto de Venta · Celulares</title>
  <link rel="icon" href="{{ url_for('static', filename='icono.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-card"><img id="brand-logo" src="/logo.png" alt="Logo de la tienda"></div>
      <strong id="brand-name">Punto de Venta</strong>
    </div>
    <nav id="nav">
      <a data-view="vender" class="active"><span class="ico">🛒</span>Vender <kbd>F1</kbd></a>
      <a data-view="productos"><span class="ico">📦</span>Productos</a>
      <a data-view="etiquetas"><span class="ico">🏷️</span>Etiquetas Zebra</a>
      <a data-view="inventario"><span class="ico">📥</span>Inventario e IMEI</a>
      <a data-view="ventas"><span class="ico">🧾</span>Ventas y tickets</a>
      <a data-view="corte"><span class="ico">💰</span>Corte y reportes</a>
      <a data-view="config"><span class="ico">⚙️</span>Configuración</a>
    </nav>
    <div class="sidebar-foot"><div id="user-box" style="color:#e2e8f0;margin-bottom:8px"></div><span id="clock"></span></div>
  </aside>

  <main id="main">
    <section id="view-vender" class="view active"></section>
    <section id="view-productos" class="view"></section>
    <section id="view-etiquetas" class="view"></section>
    <section id="view-inventario" class="view"></section>
    <section id="view-ventas" class="view"></section>
    <section id="view-corte" class="view"></section>
    <section id="view-config" class="view"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
